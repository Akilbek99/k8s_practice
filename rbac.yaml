---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akilbek
  namespace: a-maxkamov

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akilbek
  namespace: a-maxkamov
rules:
  - verbs: ["list", "delete"]
    resources: ["services"]
    apiGroups: [""]
  - verbs: ["list", "delete"]
    resources: ["deployments"]
    apiGroups: ["apps"]
  - verbs: ["list", "delete"]
    resources: ["ingresses"]
    apiGroups: ["networking.k8s.io"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akilbek
  namespace: a-maxkamov
subjects:
  - kind: ServiceAccount
    name: akilbek
    namespace: a-maxkamov
roleRef:
  kind: Role
  name: akilbek
  apiGroup: rbac.authorization.k8s.io
